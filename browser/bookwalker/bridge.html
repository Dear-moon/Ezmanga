<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Ezmanga BW</title>
  <link rel="stylesheet" href="bridge.css">
  <script src="bridge.js" defer></script>
</head>
<body>
  <main>
    <h1>连接 BW 下载器</h1>
    <p id="reader">从已登录的 BW 阅读器标签页点击扩展打开此页。</p>
    <form id="connect">
      <label>连接端口 <input id="port" type="number" min="1024" max="65535" value="19225" required></label>
      <label>本次配对码 <input id="code" type="password" autocomplete="off" required></label>
      <button id="button" type="submit">连接</button>
    </form>
    <p id="status" role="status">先运行下载命令，再填写命令窗口显示的配对码。</p>
    <p class="note">连接期间保持本页和阅读器标签页打开。会话仅传给本机下载器，不保存到文件。</p>
  </main>
</body>
</html>
